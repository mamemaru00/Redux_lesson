<!doctype html>
<!--
  練習アプリの画面。Redux の構成要素でいうと View にあたる。
  ここには見た目と部品の置き場所だけを書き、動きは src/main.js が担当する。
  id="..." を付けた要素は、main.js が document.querySelector("#...") で探して使う。
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Redux カウンター</title>
  <!-- 見た目の指定。Redux の仕組みとは関係ないので、読み飛ばしてよい -->
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 32px 16px; background: #f5f7f9; color: #1b2230; }
    main { max-width: 880px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: 1fr 1.6fr; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
    section { background: #fff; border: 1px solid #dde3ea; border-radius: 8px; padding: 20px; }
    h2 { font-size: 13px; letter-spacing: .06em; color: #5a6677; margin: 0 0 12px; }
    #count { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 8px 0 16px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #b9c3cf; background: #fff; cursor: pointer; }
    button:hover { background: #eef2f6; }
    #unknown { color: #5a6677; border-style: dashed; }
    #log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
    #log li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; background: #f5f7f9; border-radius: 4px; }
    .action { color: #a14a12; font-weight: 600; }
    .arrow { color: #8a95a3; }
    .box { margin-left: auto; font-size: 12px; color: #0e7c66; }
    p.note { font-size: 13px; color: #5a6677; margin: 12px 0 0; }
  </style>
</head>
<body>
  <main>
    <!-- 左側: カウンター本体。数字とボタン -->
    <section>
      <h2>VIEW 画面</h2>
      <!-- 数字を表示する場所。中身を書き換えるのは main.js の render だけ -->
      <div id="count">0</div>
      <!-- 各ボタンは押されると action を dispatch するだけ。main.js の一番下で登録している -->
      <div class="buttons">
        <button id="inc">+1</button>
        <button id="dec">-1</button>
        <button id="reset">リセット</button>
        <button id="unknown">知らない action</button>
      </div>
      <p class="note">ボタンは action を送るだけ。数字を描き直すのは store から知らせを受けた render です。</p>
    </section>
    <!-- 右側: dispatch の記録欄。1回 dispatch するたびに main.js の send が1行足す -->
    <section>
      <h2>DISPATCH の記録　前の状態 → action → 次の状態</h2>
      <ol id="log"></ol>
    </section>
  </main>
  <!--
    main.js を読み込む。type="module" を付けると、ファイルの中で import と export が使える。
    body の最後に置いているのは、上の部品がすべて作られてから main.js が探しに行けるようにするため。
  -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
